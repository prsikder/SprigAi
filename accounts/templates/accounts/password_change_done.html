{% extends "base.html" %}

{% block title %}Password Updated | SprigAI{% endblock %}

{% block content %}
<section class="section-pad">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="sprig-card p-4 text-center">
          <span class="icon-tile mb-3"><i class="bi bi-shield-check"></i></span>
          <h1 class="h3 fw-bold">Password updated</h1>
          <p class="text-muted">Your SprigAI account password has been changed successfully.</p>
          <a class="btn btn-success" href="{% url 'accounts:profile' %}">Back to profile</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
