{% extends "core/base.html" %}
{% block title %}Admin Login &mdash; {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="sprig-hero" style="padding: 4.5rem 0;">
  <div class="terraces"></div>
  <div class="container hero-content" style="max-width: 460px;">
    <div class="text-center mb-4">
      <span class="eyebrow"><i class="bi bi-shield-lock"></i> Restricted Access</span>
      <h1 class="mt-3" style="font-size:2rem;">Administrator Login</h1>
      <p class="text-white-50 small">This area is reserved for SprigAI administrators only.</p>
    </div>
    <div class="sprig-form-card">
      <form method="post" novalidate data-loading="Verifying...">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Admin Username</label>
          <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-sprig-primary w-100"><i class="bi bi-shield-lock me-1"></i> Secure Login</button>
      </form>
      <p class="text-center small text-muted mt-3 mb-0"><a href="{% url 'accounts:login' %}">&larr; Back to regular login</a></p>
    </div>
  </div>
</section>
{% endblock %}
